name: GitHub Stats Bar Chart
permissions:
  contents: write
on:
  schedule:
    - cron: "0 0 * * *" # اجرا هر شب ساعت ۱۲
  workflow_dispatch:      # قابلیت اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install requests matplotlib

      - name: Generate Stats Chart
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python << 'EOF'
          import requests
          import os
          import matplotlib.pyplot as plt
          from collections import defaultdict

          USERNAME = "arminkhorami"
          TOKEN = os.environ.get("GH_TOKEN")
          
          if not TOKEN:
              raise Exception("GH_TOKEN is missing!")

          headers = {"Authorization": f"token {TOKEN}"}

          # ---------- 1. جمع‌آوری داده‌ها ----------
          repos_url = "https://api.github.com/user/repos?per_page=100&type=all"
          language_totals = defaultdict(int)
          
          print("Fetching repositories...")
          while repos_url:
              try:
                  r = requests.get(repos_url, headers=headers)
                  if r.status_code != 200: break
                  repos = r.json()
                  
                  for repo in repos:
                      if repo.get("fork"): continue # اگر نمی‌خواهید ریپوهای فورک شده حساب شوند
                      
                      lang_url = repo.get("languages_url")
                      if lang_url:
                          lang_data = requests.get(lang_url, headers=headers).json()
                          for lang, size in lang_data.items():
                              language_totals[lang] += size
                              
                  repos_url = r.links.get("next", {}).get("url")
              except:
                  break

          # ---------- 2. پردازش داده‌ها (Top 5 + Other) ----------
          # مرتب‌سازی نزولی
          sorted_langs = sorted(language_totals.items(), key=lambda x: x[1], reverse=True)
          
          # فقط 5 زبان اول را نگه دار، بقیه را Other کن
          limit = 5
          top_langs = sorted_langs[:limit]
          other_bytes = sum(size for _, size in sorted_langs[limit:])
          if other_bytes > 0:
              top_langs.append(("Other", other_bytes))

          # آماده‌سازی برای نمودار (معکوس می‌کنیم تا زبان محبوب بالا باشد)
          top_langs.reverse() 
          labels = [lang for lang, _ in top_langs]
          sizes = [size for _, size in top_langs]
          total_bytes = sum(sizes) if sum(sizes) > 0 else 1
          percentages = [s/total_bytes*100 for s in sizes]

          # ---------- 3. رسم نمودار میله‌ای (Bar Chart) ----------
          # تنظیم رنگ‌ها و استایل
          bg_color = '#0d1117' # رنگ پس‌زمینه دارک گیت‌هاب
          text_color = '#c9d1d9' # رنگ متن پیش‌فرض گیت‌هاب
          bar_colors = ['#8b949e', '#58a6ff', '#3fb950', '#d29922', '#f85149', '#a371f7'] # رنگ‌های گیت‌هابی
          
          # سایز مستطیلی (عرض 10، ارتفاع 4)
          fig, ax = plt.subplots(figsize=(10, 4))
          fig.patch.set_facecolor(bg_color)
          ax.set_facecolor(bg_color)

          # رسم میله‌ها
          bars = ax.barh(labels, percentages, color=bar_colors[:len(labels)], height=0.6)

          # حذف خطوط دور نمودار (Border)
          for spine in ax.spines.values():
              spine.set_visible(False)

          # تنظیمات محورها
          ax.xaxis.set_visible(False) # حذف اعداد پایین
          ax.tick_params(axis='y', colors=text_color, labelsize=12, length=0) # تنظیم فونت لیبل‌ها

          # اضافه کردن درصد جلوی هر میله
          for bar, percent in zip(bars, percentages):
              width = bar.get_width()
              label_x_pos = width + 1  # کمی جلوتر از میله
              ax.text(label_x_pos, bar.get_y() + bar.get_height()/2, f'{percent:.1f}%', 
                      va='center', color=text_color, fontweight='bold')

          plt.title(f"Most Used Languages by {USERNAME}", color=text_color, pad=20, fontsize=14)
          plt.tight_layout()

          # ذخیره فایل SVG
          plt.savefig("lang_chart.svg", format="svg", facecolor=bg_color, bbox_inches='tight')
          print("Chart generated successfully.")
          EOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lang_chart.svg
          git commit -m "Update Stats Chart 📊" || echo "No changes"
          git push
